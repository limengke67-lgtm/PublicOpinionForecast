services:
  forecast:
    build:
      context: .
      dockerfile: Dockerfile
    image: public-opinion-forecast:local
    ports:
      - "127.0.0.1:${POF_PORT:-5001}:5001"
    environment:
      MIROFISH_RESEARCH_ONLY: "${MIROFISH_RESEARCH_ONLY:-1}"
      POF_SERVE_FRONTEND: "1"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
      LLM_MODEL_NAME: "${LLM_MODEL_NAME:-qwen-plus}"
      ZEP_API_KEY: "${ZEP_API_KEY:-}"
      LLM_BOOST_API_KEY: "${LLM_BOOST_API_KEY:-}"
      LLM_BOOST_BASE_URL: "${LLM_BOOST_BASE_URL:-}"
      LLM_BOOST_MODEL_NAME: "${LLM_BOOST_MODEL_NAME:-}"
    volumes:
      - ./backend/uploads:/app/backend/uploads
    restart: unless-stopped
    stop_grace_period: 90s
